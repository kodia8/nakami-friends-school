<!-- Put this at the bottom of your login page, before </body> -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC3q2TmBZlbwMMdHdDPgd_mRZk0qkzIlqA",
    authDomain: "nakami-friends-school.firebaseapp.com",
    projectId: "nakami-friends-school",
    storageBucket: "nakami-friends-school.firebasestorage.app",
    messagingSenderId: "643103836630",
    appId: "1:643103836630:web:3db8c49d3912b1600e3c77",
    measurementId: "G-TZNVT0EFQ0"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // SIGNUP - change 'signupBtn', 'signupEmail', 'signupPassword' to your real IDs
  const signupBtn = document.getElementById('signupBtn');
  if (signupBtn) {
    signupBtn.addEventListener('click', async () => {
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        alert('Account created! Now login.');
      } catch (e) { alert(e.message); }
    });
  }

  // LOGIN - change 'loginBtn', 'loginEmail', 'loginPassword' to your real IDs
  const loginBtn = document.getElementById('loginBtn');
  if (loginBtn) {
    loginBtn.addEventListener('click', async () => {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
        alert('Login success!');
        window.location.href = '/dashboard.html'; // change to your page
      } catch (e) { alert(e.message); }
    });
  }
</script>
