
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Nakami Friends Senior School</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #061d38, #1268b3);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-card {
            background: white;
            width: 100%;
            max-width: 440px;
            padding: 38px;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
        }

        .reset-card h1 {
            color: #092b52;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .reset-card p {
            color: #6b7c91;
            font-size: 14px;
            margin-bottom: 22px;
        }

        .reset-card label {
            display: block;
            color: #092b52;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .reset-card input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dce5ef;
            border-radius: 6px;
            margin-bottom: 18px;
        }

        .reset-card button {
            width: 100%;
            padding: 14px;
            background: #092b52;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 800;
            cursor: pointer;
        }

        .reset-card button:hover {
            background: #1268b3;
        }

        .reset-message {
            margin-top: 15px;
            font-size: 13px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #1268b3;
            font-size: 13px;
            font-weight: 700;
        }
    </style>
</head>

<body>

    <div class="reset-card">

        <h1>Forgot Password?</h1>

        <p>
            Enter the email address registered with your school account.
            We will use it to send your password recovery instructions
            once secure email authentication is connected.
        </p>

        <form id="resetForm">

            <label for="email">Registered Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your registered email"
                autocomplete="email"
                required
            >

            <button type="submit">
                REQUEST PASSWORD RESET
            </button>

            <div id="resetMessage" class="reset-message" role="status"></div>

        </form>

        <a href="login.html" class="back-link">
            ← Return to Login
        </a>

    </div>

    <script>
        document.getElementById("resetForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const message = document.getElementById("resetMessage");

            if (!email) {
                message.textContent = "Please enter your registered email.";
                message.style.color = "#c0392b";
                return;
            }

            message.textContent =
                "Password recovery is not connected yet. No email has been sent. Please contact the school administrator.";

            message.style.color = "#c0392b";

        });
    </script>

</body>
</html>
